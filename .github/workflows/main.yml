name: FastPhase.AI CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/${{ github.repository }}.git repo
          cd repo
          git checkout ${{ github.sha }}

      - name: Setup Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.10 python3-pip python3-rdkit

      - name: Install dependencies
        run: pip3 install pandas openpyxl reportlab numpy scipy

      - name: Run FastPhase.AI - Ibuprofen
        run: |
          cd repo/python
          python3 main.py --smiles "CC(C)CC1=CC=C(C=C1)C(C)C(=O)O" --format both

      - name: Run FastPhase.AI - Caffeine
        run: |
          cd repo/python
          python3 main.py --smiles "CN1C=NC2=C1C(=O)N(C(=O)N2C)C" --format both

      - name: Run FastPhase.AI - Aspirin
        run: |
          cd repo/python
          python3 main.py --smiles "CC(=O)OC1=CC=CC=C1C(=O)O" --format both

      - name: List generated reports
        run: |
          echo "=== Generated Reports ==="
          ls -la repo/python/output/reports/
          echo "========================"

      - name: Save reports to branch
        run: |
          cd repo
          
          # Create or switch to reports branch
          git checkout -b reports || git checkout reports
          
          # Copy reports
          mkdir -p reports
          cp python/output/reports/* reports/
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Auto-generated reports $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push origin reports --force
          
          # Output links
          echo ""
          echo "=========================================="
          echo "✅ REPORTS SAVED SUCCESSFULLY!"
          echo "=========================================="
          echo ""
          echo "📁 Reports Branch:"
          echo "   https://github.com/${{ github.repository }}/tree/reports"
          echo ""
          echo "📊 Reports Folder:"
          echo "   https://github.com/${{ github.repository }}/tree/reports/reports"
          echo ""
          echo "📥 Download All Reports as ZIP:"
          echo "   https://github.com/${{ github.repository }}/archive/refs/heads/reports.zip"
          echo ""
          echo "=========================================="
