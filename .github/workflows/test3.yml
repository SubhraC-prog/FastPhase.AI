name: FastPhase.AI - Test & Report Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday tests

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 📦 Install Python dependencies
      run: |
        pip install pandas openpyxl reportlab numpy scipy
    
    - name: 🔬 Setup Conda for RDKit
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.10'
        channels: conda-forge
    
    - name: 🧪 Run FastPhase.AI tests
      shell: bash -l {0}
      run: |
        conda install -c conda-forge rdkit -y
        
        # Test multiple compounds
        python main.py --smiles "CC(C)CC1=CC=C(C=C1)C(C)C(=O)O" --name "Ibuprofen" --format both
        python main.py --smiles "CN1C=NC2=C1C(=O)N(C(=O)N2C)C" --name "Caffeine" --format both
        python main.py --smiles "CC(=O)OC1=CC=CC=C1C(=O)O" --name "Aspirin" --format both
    
    - name: 📋 Verify report generation
      shell: bash -l {0}
      run: |
        echo "========================================="
        echo "GENERATED REPORTS:"
        echo "========================================="
        ls -la output/reports/ || exit 1
        REPORT_COUNT=$(ls -1 output/reports/*.xlsx 2>/dev/null | wc -l)
        echo "✅ $REPORT_COUNT Excel reports generated"
    
    - name: 📤 Upload Reports as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fastphase-reports-${{ github.run_number }}
        path: |
          output/reports/*.xlsx
          output/reports/*.pdf
          output/reports/*.json
        retention-days: 90
    
    - name: 📝 Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: fastphase-logs-${{ github.run_number }}
        path: python/*.log
        retention-days: 30
    
    - name: ✅ Summary
      run: |
        echo "## FastPhase.AI Test Results ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Compound | Status | Report |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Ibuprofen | ✅ Pass | [Download](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "| Caffeine | ✅ Pass | [Download](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "| Aspirin | ✅ Pass | [Download](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
