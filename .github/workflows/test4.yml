name: FastPhase.AI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - Show structure
      run: |
        echo "Current directory: $(pwd)"
        echo "=== Full directory tree ==="
        find . -type f -name "*.py" | head -20
        echo "=== Checking FastPhase.AI/python/ ==="
        ls -la FastPhase.AI/python/ || echo "Directory not found"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas openpyxl reportlab numpy scipy
    
    - name: Setup Conda for RDKit
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.10'
        channels: conda-forge
    
    - name: Run FastPhase.AI
      shell: bash -l {0}
      run: |
        conda install -c conda-forge rdkit -y
        
        # Navigate to correct directory
        cd fastphase/python/
        
        echo "=== Running from: $(pwd) ==="
        echo "Python files in this directory:"
        ls -la *.py
        
        # Set Python path for imports
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        
        # Run main.py with test SMILES
        python main.py --smiles "CC(C)CC1=CC=C(C=C1)C(C)C(=O)O" --name "Ibuprofen" --format both
        
        # Check if reports were generated
        echo "=== Checking for generated reports ==="
        ls -la ../../output/reports/ || echo "No reports yet"
    
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          output/reports/*.xlsx
          output/reports/*.pdf
          fastphase/output/reports/*.xlsx
          fastphase/output/reports/*.pdf
        retention-days: 30
        if-no-files-found: warn
